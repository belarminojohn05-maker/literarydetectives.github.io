<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literary Detectives — Mission 3: Solve the Literary Case</title>
    <!-- Tone.js for sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#172A3A',
                        ivory: '#F7F4ED',
                        gold: '#C6A15B',
                        slate: '#52616B',
                        cardBg: '#FFFFFF',
                        darkCard: '#1E3342'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #172A3A;
            color: #172A3A;
        }
        @keyframes guideGlow {
            0%, 100% {
                box-shadow: 0 0 12px rgba(198, 161, 91, 0.6);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 24px rgba(198, 161, 91, 0.95);
                transform: scale(1.02);
            }
        }
        .guide-glow {
            animation: guideGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full flex flex-col bg-navy text-ivory antialiased selection:bg-gold selection:text-navy">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-navy border-b border-slate/30 py-4 px-6 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gold flex items-center justify-center text-navy font-bold text-xl shadow-inner">
                    🔍
                </div>
                <div>
                    <h1 class="text-sm font-semibold tracking-wider text-gold uppercase">Literary Detectives • Grade 9 English</h1>
                    <p class="text-lg font-bold text-ivory">Mission 3: Solve the Literary Case</p>
                </div>
            </div>
            <div id="score-header" class="hidden items-center bg-darkCard px-4 py-2 rounded-xl border border-gold/40 shadow-sm">
                <span class="text-xs text-slate-300 mr-2 uppercase tracking-wide">Score Ledger:</span>
                <span id="header-score-val" class="text-gold font-bold text-lg">0</span>
                <span class="text-xs text-slate-400 ml-1">/ 100 pts</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
            <div id="screen-container" class="w-full max-w-4xl bg-ivory text-navy rounded-2xl shadow-2xl overflow-hidden flex flex-col min-h-[550px] transition-all duration-300">
                <!-- Dynamic Screen Content inserted here by JavaScript -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-navy/80 border-t border-slate/30 py-3 px-6 text-center text-xs text-slate-400">
            Literary Detectives Quest &bull; Interactive Literary Case Study &bull; Grade 9 English
        </footer>
    </div>

    <!-- Application Logic Script -->
    <script>
        // --- State Management ---
        const state = {
            currentScreen: 1,
            score: 0,
            screen2Stage: 1, // 1 = recap, 2 = routes
            soundTrailCompleted: false,
            meaningTrailCompleted: false,
            meaningSelection: null, // Track explicit selection for Screen 8
            tasks: {
                audioForensics: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 15, solved: false },
                patternLog: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 10, solved: false },
                signalPathStep1: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 5, solved: false },
                signalPathStep2: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 5, solved: false },
                meaningMeterClass: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 5, solved: false },
                meaningMeterInterp: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 10, solved: false },
                sensoryTaste: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 5, solved: false, feedback: '', status: 'pending' },
                sensoryTouch: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 5, solved: false, feedback: '', status: 'pending' },
                verdict1: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 8, solved: false },
                verdict2: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 8, solved: false },
                verdict3: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 8, solved: false },
                verdict4: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 8, solved: false },
                verdict5: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 8, solved: false },
                verdict6: { attempts: 0, maxAttempts: 2, points: 0, maxPoints: 0, solved: false } // Unscored Character Insight
            },
            verdictCurrentSubScreen: 1
        };

        // --- Sound Manager (Tone.js) ---
        const synths = {};
        let audioInitialized = false;

        async function ensureAudio() {
            if (!audioInitialized) {
                await Tone.start();
                synths.correct = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 1 }, volume: -6 }).toDestination();
                audioInitialized = true;
            }
        }

        function playSound(type) {
            // Only play sound for correct answers as requested
            if (type !== 'correct') return;
            
            ensureAudio().then(() => {
                const now = Tone.now();
                if (type === 'correct') synths.correct.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
            }).catch(e => console.warn("Audio error", e));
        }

        // --- Helper: Text-to-Speech ---
        let isSpeechPaused = false;
        let currentUtterance = null;
        let lastPlayedText = "";

        function playSpeech(text) {
            playSound('click');
            
            // If already paused and text matches, resume
            if (isSpeechPaused && currentUtterance && lastPlayedText === text) {
                window.speechSynthesis.resume();
                isSpeechPaused = false;
                return;
            }

            // Otherwise, start fresh
            window.speechSynthesis.cancel();
            lastPlayedText = text;
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.rate = 0.95;
            currentUtterance.onend = function() {
                isSpeechPaused = false;
            };
            
            window.speechSynthesis.speak(currentUtterance);
            isSpeechPaused = false;
        }

        function pauseSpeech() {
            playSound('click');
            if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
                window.speechSynthesis.pause();
                isSpeechPaused = true;
            }
        }

        function stopSpeech(fromButton = false) {
            if (fromButton) playSound('click');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            currentUtterance = null;
            isSpeechPaused = false;
            lastPlayedText = "";
        }

        function replaySpeech(text) {
            playSound('click');
            window.speechSynthesis.cancel();
            setTimeout(() => {
                lastPlayedText = text;
                currentUtterance = new SpeechSynthesisUtterance(text);
                currentUtterance.rate = 0.95;
                currentUtterance.onend = function() {
                    isSpeechPaused = false;
                };
                window.speechSynthesis.speak(currentUtterance);
                isSpeechPaused = false;
            }, 50);
        }

        function getAudioControls(text) {
            const escapedText = text.replace(/'/g, "\\'");
            return `
                <div class="flex space-x-2">
                    <button onclick="playSpeech('${escapedText}')" class="bg-gold/20 hover:bg-gold/30 text-navy px-3 py-1.5 rounded-lg text-xs font-bold transition-all">▶ PLAY</button>
                    <button onclick="pauseSpeech()" class="bg-slate/10 hover:bg-slate/20 text-slate px-3 py-1.5 rounded-lg text-xs font-bold transition-all">⏸ PAUSE</button>
                    <button onclick="stopSpeech(true)" class="bg-rose-100 hover:bg-rose-200 text-rose-900 px-3 py-1.5 rounded-lg text-xs font-bold transition-all">⏹ STOP</button>
                    <button onclick="replaySpeech('${escapedText}')" class="bg-blue-100 hover:bg-blue-200 text-blue-900 px-3 py-1.5 rounded-lg text-xs font-bold transition-all">↺ REPLAY</button>
                </div>
            `;
        }

        // --- Helper: Recalculate Running Score Ledger ---
        function updateScoreLedger() {
            let total = 0;
            for (let key in state.tasks) {
                total += state.tasks[key].points || 0;
            }
            state.score = total;
            const headerScore = document.getElementById('header-score-val');
            if (headerScore) headerScore.textContent = state.score;
            const scoreHeader = document.getElementById('score-header');
            if (scoreHeader) {
                if (state.currentScreen > 1 && state.currentScreen < 12) {
                    scoreHeader.classList.remove('hidden');
                    scoreHeader.classList.add('flex');
                } else {
                    scoreHeader.classList.remove('flex');
                    scoreHeader.classList.add('hidden');
                }
            }
        }

        // --- Navigation Controller ---
        function goToScreen(screenNum) {
            playSound('nav');
            stopSpeech(false);
            state.currentScreen = screenNum;
            updateScoreLedger();
            renderScreen();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.revealRoutes = function() {
            playSound('click');
            state.screen2Stage = 2;
            renderScreen();
        };

        // --- Render Dispatcher ---
        function renderScreen() {
            const container = document.getElementById('screen-container');
            if (!container) return;
            container.innerHTML = '';

            switch(state.currentScreen) {
                case 1: renderScreen1(container); break;
                case 2: renderScreen2(container); break;
                case 3: renderScreen3(container); break;
                case 4: renderScreen4(container); break;
                case 5: renderScreen5(container); break;
                case 6: renderScreen6(container); break;
                case 7: renderScreen7(container); break;
                case 8: renderScreen8(container); break;
                case 9: renderScreen9(container); break;
                case 10: renderScreen10(container); break;
                case 11: renderScreen11(container); break;
                case 12: renderScreen12(container); break;
                default: renderScreen1(container); break;
            }
            updateScoreLedger();
        }

        // ==========================================
        // SCREEN 1: Open the Case
        // ==========================================
        function renderScreen1(container) {
            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center bg-gradient-to-b from-ivory to-stone-100 overflow-y-auto">
                    <div class="w-24 h-24 bg-navy text-gold rounded-3xl flex items-center justify-center text-5xl mb-6 shadow-xl animate-bounce shrink-0">
                        🏮
                    </div>
                    <span class="bg-gold/20 text-navy font-semibold px-4 py-1 rounded-full text-xs uppercase tracking-widest mb-3">Grade 9 English Mission 3</span>
                    <h2 class="text-3xl sm:text-4xl font-extrabold text-navy mb-4">THE LANTERN AT BELL BRIDGE</h2>
                    <p class="text-slate max-w-lg text-base sm:text-lg mb-6 leading-relaxed">
                        A story has left behind a trail of clues. Find the evidence before you deliver your verdict. Target Competency: EN9LIT-I-1 (items f and k).
                    </p>

                    <div class="bg-white/80 p-5 rounded-2xl border border-slate/20 shadow-sm max-w-2xl w-full mb-8 text-left">
                        <h3 class="text-sm font-bold text-navy uppercase tracking-wider mb-2 border-b border-slate/20 pb-2">Measurable Objectives:</h3>
                        <ul class="text-sm text-slate-700 space-y-2 list-disc pl-5">
                            <li>Identify rhyme, repetition, alliteration, and anaphora by locating evidence in a literary passage.</li>
                            <li>Interpret hyperbole, metaphor, and personification and explain their effects.</li>
                            <li>Identify taste and touch imagery and explain how sensory details help readers imagine a scene.</li>
                        </ul>
                    </div>

                    <button onclick="goToScreen(2)" class="bg-navy hover:bg-navy/90 text-ivory font-bold px-8 py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center space-x-3 text-lg guide-glow">
                        <span>OPEN CASE FILE</span>
                        <span>→</span>
                    </button>
                </div>
            `;
        }

        // ==========================================
        // SCREEN 2: Choose Your Investigation Route
        // ==========================================
        function renderScreen2(container) {
            const soundDone = state.soundTrailCompleted;
            const meaningDone = state.meaningTrailCompleted;

            if (state.screen2Stage === 1) {
                container.innerHTML = `
                    <div class="flex-1 p-8 flex flex-col justify-between overflow-y-auto">
                        <div>
                            <div class="flex justify-between items-center mb-6 border-b border-slate/20 pb-4">
                                <span class="text-xs uppercase font-bold tracking-wider text-slate">Quick Recall</span>
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-navy mb-4">Review the Clues</h2>
                            
                            <div class="space-y-4 mb-6">
                                <div class="bg-white p-5 rounded-2xl border border-slate/20 shadow-sm">
                                    <h3 class="font-bold text-navy mb-3 text-sm uppercase tracking-wider text-gold">Mission 1 — Hear the Clues</h3>
                                    <ul class="text-sm text-slate-700 space-y-2">
                                        <li><strong class="text-navy">Rhyme:</strong> words share ending sounds.</li>
                                        <li><strong class="text-navy">Repetition:</strong> a word or phrase appears more than once.</li>
                                        <li><strong class="text-navy">Alliteration:</strong> nearby words repeat an initial consonant sound.</li>
                                        <li><strong class="text-navy">Anaphora:</strong> successive lines or clauses begin with the same word or phrase.</li>
                                    </ul>
                                </div>
                                <div class="bg-white p-5 rounded-2xl border border-slate/20 shadow-sm">
                                    <h3 class="font-bold text-navy mb-3 text-sm uppercase tracking-wider text-gold">Mission 2 — Decode the Hidden Meaning</h3>
                                    <ul class="text-sm text-slate-700 space-y-2">
                                        <li><strong class="text-navy">Hyperbole:</strong> deliberate exaggeration.</li>
                                        <li><strong class="text-navy">Simile:</strong> comparison often signaled by like or as.</li>
                                        <li><strong class="text-navy">Metaphor:</strong> direct comparison.</li>
                                        <li><strong class="text-navy">Personification:</strong> a human quality or action is given to something nonhuman.</li>
                                    </ul>
                                </div>
                            </div>
                            <p class="text-slate text-sm font-medium italic text-center mb-4">You have reviewed the clues. Now apply what you know to a new story.</p>
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-slate/20">
                            <button onclick="goToScreen(1)" class="px-4 py-2 border border-slate/40 rounded-xl text-slate hover:bg-slate/10 font-medium text-sm">
                                ← Back
                            </button>
                            <button onclick="revealRoutes()" class="bg-navy hover:bg-navy/90 text-ivory guide-glow px-6 py-3 rounded-xl font-bold text-sm transition-all shadow-md">
                                CONTINUE →
                            </button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex-1 p-8 flex flex-col justify-between overflow-y-auto">
                        <div>
                            <div class="flex justify-between items-center mb-6 border-b border-slate/20 pb-4">
                                <span class="text-xs uppercase font-bold tracking-wider text-slate">Case Map • Route Selection</span>
                                <span class="text-xs font-semibold px-3 py-1 bg-gold/20 text-navy rounded-full">
                                    Progress: Sound (${soundDone ? '✓ Completed' : 'Pending'}) | Meaning (${meaningDone ? '✓ Completed' : 'Pending'})
                                </span>
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-navy mb-3">Which trail will you investigate first?</h2>
                            <p class="text-slate text-sm sm:text-base mb-8">
                                Both trails are required; the choice changes order only. Complete both before proceeding to the final verdict.
                            </p>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                <!-- Sound Trail Card -->
                                <div onclick="goToScreen(3)" class="cursor-pointer bg-white border-2 ${soundDone ? 'border-emerald-600 bg-emerald-50/30' : 'border-gold/60 hover:border-navy'} rounded-2xl p-6 shadow-md transition-all flex flex-col justify-between group ${!soundDone ? 'guide-glow' : ''}">
                                    <div>
                                        <div class="flex items-center justify-between mb-3">
                                            <span class="text-2xl">🎵</span>
                                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${soundDone ? 'bg-emerald-100 text-emerald-800' : 'bg-gold/20 text-navy'}">
                                                ${soundDone ? 'Completed' : 'Available'}
                                            </span>
                                        </div>
                                        <h3 class="text-xl font-bold text-navy mb-2 group-hover:text-gold transition-colors">Sound Trail</h3>
                                        <p class="text-sm text-slate">Investigate rhyme, repetition, and anaphora clues from the passage audio.</p>
                                    </div>
                                    <div class="mt-6 text-sm font-bold text-navy flex items-center justify-end">
                                        <span>${soundDone ? 'Review Sound Trail' : 'Enter Sound Trail'}</span> <span class="ml-2">→</span>
                                    </div>
                                </div>

                                <!-- Meaning Trail Card -->
                                <div onclick="goToScreen(8)" class="cursor-pointer bg-white border-2 ${meaningDone ? 'border-emerald-600 bg-emerald-50/30' : 'border-gold/60 hover:border-navy'} rounded-2xl p-6 shadow-md transition-all flex flex-col justify-between group ${soundDone && !meaningDone ? 'guide-glow' : ''}">
                                    <div>
                                        <div class="flex items-center justify-between mb-3">
                                            <span class="text-2xl">📖</span>
                                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${meaningDone ? 'bg-emerald-100 text-emerald-800' : 'bg-gold/20 text-navy'}">
                                                ${meaningDone ? 'Completed' : 'Available'}
                                            </span>
                                        </div>
                                        <h3 class="text-xl font-bold text-navy mb-2 group-hover:text-gold transition-colors">Meaning Trail</h3>
                                        <p class="text-sm text-slate">Investigate figurative meaning (ribbon metaphor) and sensory side quest clues.</p>
                                    </div>
                                    <div class="mt-6 text-sm font-bold text-navy flex items-center justify-end">
                                        <span>${meaningDone ? 'Review Meaning Trail' : 'Enter Meaning Trail'}</span> <span class="ml-2">→</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-between items-center pt-4 border-t border-slate/20">
                            <button onclick="state.screen2Stage = 1; renderScreen(); playSound('click');" class="px-4 py-2 border border-slate/40 rounded-xl text-slate hover:bg-slate/10 font-medium text-sm">
                                ← Quick Recall
                            </button>
                            <button onclick="checkProceedToVerdict()" id="to-verdict-btn" class="${(soundDone && meaningDone) ? 'bg-navy hover:bg-navy/90 text-ivory guide-glow cursor-pointer' : 'bg-slate/30 text-slate-500 cursor-not-allowed'} px-6 py-3 rounded-xl font-bold text-sm transition-all shadow-md">
                                Proceed to Final Verdict →
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function checkProceedToVerdict() {
            if (state.soundTrailCompleted && state.meaningTrailCompleted) {
                state.verdictCurrentSubScreen = 1; // Reset sub-screen state to prevent blank screen on review
                goToScreen(10);
            } else {
                playSound('wrong');
                showModal("Trails Required", "Please complete both the Sound Trail and Meaning Trail before unlocking the Final Verdict.");
            }
        }

        // ==========================================
        // SCREEN 3: Read the Case — Part One
        // ==========================================
        function renderScreen3(container) {
            const part1Text = "At dusk, Mara hurried toward the old bridge. Cold stones pressed against her palms as she held the lantern. Bright branches bent above the black bank. Wait for me, wait for me, she called. She climbed through the night, holding the lantern tight.";

            container.innerHTML = `
                <div class="flex-1 p-8 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-4 border-b border-slate/20 pb-3">
                            <span class="text-xs uppercase font-bold tracking-wider text-slate">Case Reading • Part 1 of 2</span>
                            <span class="text-xs font-semibold px-3 py-1 bg-navy/10 text-navy rounded-full">The Lantern at Bell Bridge</span>
                        </div>
                        
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate/20 mb-6">
                            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-4">
                                <h3 class="text-lg font-bold text-navy">Passage Excerpt — Part One</h3>
                                ${getAudioControls(part1Text)}
                            </div>
                            <div class="text-navy/90 text-lg leading-relaxed font-serif space-y-3 bg-ivory/60 p-6 rounded-xl border border-gold/30">
                                <p>At dusk, Mara hurried toward the old bridge.</p>
                                <p>Cold stones pressed against her palms as she held the lantern.</p>
                                <p>Bright branches bent above the black bank.</p>
                                <p>“Wait for me, wait for me,” she called.</p>
                                <p>She climbed through the night,<br>holding the lantern tight.</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-slate/20">
                        <button onclick="goToScreen(2)" class="px-4 py-2 border border-slate/40 rounded-xl text-slate hover:bg-slate/10 font-medium text-sm">
                            ← Case Map
                        </button>
                        <button onclick="goToScreen(4)" class="bg-navy hover:bg-navy/90 text-ivory px-6 py-3 rounded-xl font-bold text-sm shadow-md transition-all guide-glow">
                            Next Part (Part 2) →
                        </button>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // SCREEN 4: Read the Case — Part Two
        // ==========================================
        function renderScreen4(container) {
            const part2Text = "No light was left. No road was clear. No voice was near. The wind whispered warnings through the trees. Below, the river was a ribbon of silver beneath the moon. I have a thousand fears, Mara said, but I will not turn back. She tasted a tart berry and felt the rough rope scrape her skin. At last, the lantern woke, and the village sighed with relief.";

            container.innerHTML = `
                <div class="flex-1 p-8 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-4 border-b border-slate/20 pb-3">
                            <span class="text-xs uppercase font-bold tracking-wider text-slate">Case Reading • Part 2 of 2</span>
                            <span class="text-xs font-semibold px-3 py-1 bg-navy/10 text-navy rounded-full">The Lantern at Bell Bridge</span>
                        </div>
                        
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate/20 mb-6">
                            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-4">
                                <h3 class="text-lg font-bold text-navy">Passage Excerpt — Part Two</h3>
                                ${getAudioControls(part2Text)}
                            </div>
                            <div class="text-navy/90 text-base sm:text-lg leading-relaxed font-serif space-y-3 bg-ivory/60 p-6 rounded-xl border border-gold/30">
                                <p>No light was left. No road was clear. No voice was near.</p>
                                <p>The wind whispered warnings through the trees.</p>
                                <p>Below, the river was a ribbon of silver beneath the moon.</p>
                                <p>“I have a thousand fears,” Mara said, “but I will not turn back.”</p>
                                <p>She tasted a tart berry and felt the rough rope scrape her skin.</p>
                                <p>At last, the lantern woke, and the village sighed with relief.</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-slate/20">
                        <button onclick="goToScreen(3)" class="px-4 py-2 border border-slate/40 rounded-xl text-slate hover:bg-slate/10 font-medium text-sm">
                            ← Part One
                        </button>
                        <button onclick="goToScreen(5)" class="bg-navy hover:bg-navy/90 text-ivory px-6 py-3 rounded-xl font-bold text-sm shadow-md transition-all guide-glow">
                            Begin Sound Trail Activities →
                        </button>
                    </div>

                    document.querySelectorAll('input[name="verdict_opt"]').forEach(el => el.disabled = true);
                }
            }
        }

        // ==========================================
        // SCREEN 11: Final Verdict — Part 2 (Checks 4, 5, 6)
        // ==========================================
        function renderScreen11(container) {
            const sub = state.verdictCurrentSubScreen;

            if (sub === 4) {
                container.innerHTML = getVerdictCardHtml(4, "Which pair of verbs gives human-like actions to nonhuman things in the final sentence?", [
                    {val: "A", text: "A. “woke” and “sighed”"},
                    {val: "B", text: "B. “hurried” and “called”"},
                    {val: "C", text: "C. “tasted” and “felt”"},
                    {val: "D", text: "D. “pressed” and “scraped”"}
                ], state.tasks.verdict4, "submitVerdict4");
            } else if (sub === 5) {
                container.innerHTML = getVerdictCardHtml(5, "What does the description suggest?", [
                    {val: "A", text: "A. The lantern has literally awakened from sleep, and the village is physically sighing."},
                    {val: "B", text: "B. The lantern’s light returns, and the villagers feel relieved."},
                    {val: "C", text: "C. The lantern remains dark, leaving the villagers uncertain."},
                    {val: "D", text: "D. The villagers are angry because the lantern has been taken away."}
                ], state.tasks.verdict5, "submitVerdict5");
            } else if (sub === 6) {
                container.innerHTML = getVerdictCardHtml(6, "Mara admits that she is afraid, yet she chooses not to turn back. What does her decision suggest about her values?", [
                    {val: "A", text: "A. She values courage and perseverance, even when she feels afraid."},
                    {val: "B", text: "B. She values avoiding every risk more than completing the journey."},
                    {val: "C", text: "C. She believes fear should be hidden rather than acknowledged."},
                    {val: "D", text: "D. She continues only because she expects others to praise her."}
                ], state.tasks.verdict6, "submitVerdict6", true);
            }
        }

        function submitVerdict4() {
            playSound('click');
            const task = state.tasks.verdict4;
            if (task.solved) return;
            const sel = document.querySelector('input[name="verdict_opt"]:checked');
            if (!sel) { showModal("Selection Required", "Please select an option."); return; }

            task.attempts++;
            const fb = document.getElementById('v-feedback');
            if (sel.value === 'A') {
                playSound('correct');
                task.solved = true;
                task.points = (task.attempts === 1) ? 8 : 4;
                updateScoreLedger();
                fb.innerHTML = `<div class="p-4 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200">That’s right. “Woke” and “sighed” are human-like actions used to describe the lantern and village. (Earned ${task.points} pts)</div>`;
                document.querySelectorAll('input[name="verdict_opt"]').forEach(el => el.disabled = true);
            } else {
                playSound('wrong');
                if (task.attempts < task.maxAttempts) {
                    fb.innerHTML = `<div class="p-4 bg-amber-50 text-amber-900 rounded-xl border border-amber-200">Which verbs describe the lantern or village doing something a person might do? Try again!</div>`;
                } else {
                    task.solved = true;
                    task.points = 0;
                    updateScoreLedger();
                    fb.innerHTML = `<div class="p-4 bg-rose-50 text-rose-900 rounded-xl border border-emerald-200">Nice try—let’s look at the description together. The correct answer is <strong>A. “woke” and “sighed.”</strong> These verbs give human-like actions to the lantern and village.</div>`;
                    document.querySelectorAll('input[name="verdict_opt"]').forEach(el => el.disabled = true);
                }
            }
        }

        function submitVerdict5() {
            playSound('click');
            const task = state.tasks.verdict5;
            if (task.solved) return;
            const sel = document.querySelector('input[name="verdict_opt"]:checked');
            if (!sel) { showModal("Selection Required", "Please select an option."); return; }

            task.attempts++;
            const fb = document.getElementById('v-feedback');
            if (sel.value === 'B') {
                playSound('correct');
                task.solved = true;
                task.points = (task.attempts === 1) ? 8 : 4;
                updateScoreLedger();
                fb.innerHTML = `<div class="p-4 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200">That’s right. The lantern’s light returns, and the people feel relieved. (Earned ${task.points} pts) 🏆 <span class="font-bold text-gold">Evidence Reporter Badge Unlocked!</span></div>`;
                document.querySelectorAll('input[name="verdict_opt"]').forEach(el => el.disabled = true);
            } else {
                playSound('wrong');
                if (task.attempts < task.maxAttempts) {
                    fb.innerHTML = `<div class="p-4 bg-amber-50 text-amber-900 rounded-xl border border-amber-200">Think about what happens when the lantern’s light returns and how people might feel afterward. Try again!</div>`;
                } else {
                    task.solved = true;
                    task.points = 0;
                    updateScoreLedger();
                    fb.innerHTML = `<div class="p-4 bg-rose-50 text-rose-900 rounded-xl border border-emerald-200">Nice try—let’s connect the description to what is happening. The correct answer is <strong>B. The lantern’s light returns, and the villagers feel relieved.</strong> The personification communicates the return of light and the villagers’ relief.</div>`;
                    document.querySelectorAll('input[name="verdict_opt"]').forEach(el => el.disabled = true);
                }
            }
        }

        function submitVerdict6() {
            playSound('click');
            const task = state.tasks.verdict6;
            if (task.solved) return;
            const sel = document.querySelector('input[name="verdict_opt"]:checked');
            if (!sel) { showModal("Selection Required", "Please select an option."); return; }

            task.attempts++;
            const fb = document.getElementById('v-feedback');
            if (sel.value === 'A') {
                playSound('correct');
                task.solved = true;
                task.points = 0; // Unscored item
                updateScoreLedger();
                fb.innerHTML = `<div class="p-4 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200">That’s right. Mara’s decision suggests courage and perseverance. She acknowledges her fear but chooses to continue. (Required response logged)</div>`;
                document.querySelectorAll('input[name="verdict_opt"]').forEach(el => el.disabled = true);
            } else {
                playSound('wrong');
                if (task.attempts < task.maxAttempts) {
                    fb.innerHTML = `<div class="p-4 bg-amber-50 text-amber-900 rounded-xl border border-amber-200">Look at the contrast between what Mara admits she feels and what she chooses to do. Try again!</div>`;
                } else {
                    task.solved = true;
                    task.points = 0;
                    updateScoreLedger();
                    fb.innerHTML = `<div class="p-4 bg-rose-50 text-rose-900 rounded-xl border border-emerald-200">Nice try—let’s consider Mara’s choice. The best answer is <strong>A: she shows courage and perseverance by continuing even though she feels afraid.</strong></div>`;
                    document.querySelectorAll('input[name="verdict_opt"]').forEach(el => el.disabled = true);
                }
            }
        }

        // ==========================================
        // SCREEN 12: Case Closed — Badge Cabinet
        // ==========================================
        function renderScreen12(container) {
            const finalScore = state.score;
            const isMaster = finalScore >= 80;

            container.innerHTML = `
                <div class="flex-1 p-8 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-6 border-b border-slate/20 pb-4">
                            <span class="text-xs uppercase font-bold tracking-wider text-slate">Case Closed • Mission 3 Complete</span>
                            <span class="text-xs font-semibold px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full">All Evidence Filed</span>
                        </div>

                        <div class="text-center mb-8 bg-gradient-to-r from-navy to-darkCard text-ivory p-8 rounded-3xl shadow-xl">
                            <div class="text-5xl mb-3">🏅</div>
                            <h2 class="text-3xl font-extrabold text-gold mb-2">CASE CLOSED: THE EVIDENCE HAS BEEN FILED</h2>
                            <p class="text-slate-300 text-sm max-w-md mx-auto mb-6">You have successfully investigated the literary case of The Lantern at Bell Bridge.</p>
                            
                            <div class="inline-flex items-center bg-ivory text-navy px-6 py-3 rounded-2xl shadow-inner font-bold text-2xl">
                                <span>Final Score:</span>
                                <span class="text-gold ml-2">${finalScore}</span>
                                <span class="text-slate text-base ml-1">/ 100</span>
                            </div>
                        </div>

                        <!-- Badge Cabinet -->
                        <h3 class="text-xl font-bold text-navy mb-4">Your Badge Cabinet</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">
                            <!-- Sound Listener -->
                            <div class="p-4 rounded-2xl border ${state.tasks.audioForensics.solved && state.tasks.audioForensics.points > 0 ? 'bg-gold/10 border-gold shadow-sm' : 'bg-slate/10 border-slate/20 opacity-60'} flex flex-col items-center text-center">
                                <span class="text-3xl mb-2">🎵</span>
                                <h4 class="font-bold text-navy text-sm">Sound Listener</h4>
                                <p class="text-xs text-slate mt-1">${state.tasks.audioForensics.solved && state.tasks.audioForensics.points > 0 ? 'Earned for rhyme evidence.' : 'Locked'}</p>
                            </div>

                            <!-- Pattern Tracker -->
                            <div class="p-4 rounded-2xl border ${state.tasks.patternLog.solved || state.tasks.signalPathStep2.solved ? 'bg-gold/10 border-gold shadow-sm' : 'bg-slate/10 border-slate/20 opacity-60'} flex flex-col items-center text-center">
                                <span class="text-3xl mb-2">🔁</span>
                                <h4 class="font-bold text-navy text-sm">Pattern Tracker</h4>
                                <p class="text-xs text-slate mt-1">${state.tasks.patternLog.solved || state.tasks.signalPathStep2.solved ? 'Earned for repetition & anaphora.' : 'Locked'}</p>
                            </div>

                            <!-- Meaning Mapper -->
                            <div class="p-4 rounded-2xl border ${state.tasks.meaningMeterInterp.solved && state.tasks.meaningMeterInterp.points > 0 ? 'bg-gold/10 border-gold shadow-sm' : 'bg-slate/10 border-slate/20 opacity-60'} flex flex-col items-center text-center">
                                <span class="text-3xl mb-2">🗺️</span>
                                <h4 class="font-bold text-navy text-sm">Meaning Mapper</h4>
                                <p class="text-xs text-slate mt-1">${state.tasks.meaningMeterInterp.solved && state.tasks.meaningMeterInterp.points > 0 ? 'Earned for meaning analysis.' : 'Locked'}</p>
                            </div>

                            <!-- Sensory Scout -->
                            <div class="p-4 rounded-2xl border ${state.tasks.sensoryTaste.solved || state.tasks.sensoryTouch.solved ? 'bg-gold/10 border-gold shadow-sm' : 'bg-slate/10 border-slate/20 opacity-60'} flex flex-col items-center text-center">
                                <span class="text-3xl mb-2">🍓</span>
                                <h4 class="font-bold text-navy text-sm">Sensory Scout</h4>
                                <p class="text-xs text-slate mt-1">${state.tasks.sensoryTaste.solved || state.tasks.sensoryTouch.solved ? 'Earned for sensory side quest.' : 'Locked'}</p>
                            </div>

                            <!-- Evidence Reporter -->
                            <div class="p-4 rounded-2xl border ${state.tasks.verdict5.solved ? 'bg-gold/10 border-gold shadow-sm' : 'bg-slate/10 border-slate/20 opacity-60'} flex flex-col items-center text-center">
                                <span class="text-3xl mb-2">📝</span>
                                <h4 class="font-bold text-navy text-sm">Evidence Reporter</h4>
                                <p class="text-xs text-slate mt-1">${state.tasks.verdict5.solved ? 'Earned for final verdict.' : 'Locked'}</p>
                            </div>

                            <!-- Master Literary Detective -->
                            <div class="p-4 rounded-2xl border ${isMaster ? 'bg-emerald-100 border-emerald-500 shadow-sm' : 'bg-slate/10 border-slate/20 opacity-60'} flex flex-col items-center text-center">
                                <span class="text-3xl mb-2">⭐</span>
                                <h4 class="font-bold text-navy text-sm">Master Detective</h4>
                                <p class="text-xs text-slate mt-1">${isMaster ? 'Awarded for 80+ score!' : 'Requires 80+ score'}</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-slate/20">
                        <button onclick="goToScreen(2)" class="px-4 py-2 border border-slate/40 rounded-xl text-slate hover:bg-slate/10 font-medium text-sm">
                            Review Case Map
                        </button>
                        <button onclick="restartMission()" class="bg-navy hover:bg-navy/90 text-ivory px-6 py-3 rounded-xl font-bold text-sm shadow-md transition-all guide-glow">
                            Replay Mission ↺
                        </button>
                    </div>
                </div>
            `;
        }

        function restartMission() {
            playSound('nav');
            for (let k in state.tasks) {
                state.tasks[k].attempts = 0;
                state.tasks[k].points = 0;
                state.tasks[k].solved = false;
                if (k === 'sensoryTaste' || k === 'sensoryTouch') {
                    state.tasks[k].status = 'pending';
                    state.tasks[k].feedback = '';
                }
            }
            state.soundTrailCompleted = false;
            state.meaningTrailCompleted = false;
            state.verdictCurrentSubScreen = 1;
            state.screen2Stage = 1;
            goToScreen(1);
        }

        // --- Custom Modal Helper ---
        function showModal(title, message) {
            const existingModal = document.getElementById('custom-modal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'custom-modal';
            modal.className = 'fixed inset-0 bg-navy/60 backdrop-blur-sm flex items-center justify-center p-4 z-50';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate/20 text-navy animate-in fade-in zoom-in duration-200">
                    <h3 class="text-lg font-bold mb-2 flex items-center">
                        <span class="mr-2 text-gold">⚠️</span> ${title}
                    </h3>
                    <p class="text-slate text-sm mb-6">${message}</p>
                    <div class="flex justify-end">
                        <button onclick="playSound('click'); document.getElementById('custom-modal').remove()" class="bg-navy hover:bg-navy/90 text-ivory px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm transition-all guide-glow">
                            Got It
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // --- Initial Load ---
        window.onload = function() {
            // Note: Tone.js requires a user gesture to start AudioContext.
            // We initialize it smoothly when they first click "OPEN CASE FILE".
            updateScoreLedger();
            renderScreen();
        };
    </script>
</body>
</html>
